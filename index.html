</style></head><body><div id="app"></div><div id="ov"></div><div id="ho"></div><script>
// ===== IMAGENES =====
const IMG_DIR='imagenes/';
const IMG_BACK=IMG_DIR+'reverso.jpg'; // reverso de las cartas (mano del rival)
// Otros archivos en imagenes/: fondo-tablero.jpg (partida), fondo-inicio.jpg (menú inicial), fondo-decks.jpg (editor de decks), <nombre-de-carta>.jpg (cada carta)
const slug=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const imgFor=n=>IMG_DIR+slug(n)+'.jpg';
const imgTag=(n,cls)=>`<img class="${cls||'card-img'}" src="${imgFor(n)}" alt="${n}" onerror="this.remove()">`;
// ===== DATOS =====
const T=s=>s.trim().split('\n').map(l=>{const a=l.split('|'),z=a[5]==='s'||a[5]==='r';return z?{n:a[0],c:+a[1],a:0,d:0,ty:'',st:'',k:a[5],x:a[6]||''}:{n:a[0],c:+a[1],a:+a[2]||0,d:+a[3]||0,ty:a[4]||'',st:a[5]||'',k:a[6],x:a[7]||''}});
const CAT={};T(`
Mono 0|0|0|10|Mono|Viento|m
Monino|10|10|10|Mono|Tierra|m
Mono loco|100|100|100|Mono|Fuego|m
Puerco 0|0|0|10|Puerco|Viento|m

Puerco con estilo|60|70|50|Puerco|Tierra|m
Puerco 7|70|80|60|Puerco|Tierra|m
Puerco 8|80|90|70|Puerco|Tierra|m
La cerda|90|100|80|Puerco|Tierra|m
Puercomelon|100|100|100|Puerco|Tierra|m
Rebotador|20|0|10|Mutante|Viento|m|Al invocarlo: regresa un monstruo a la mano de su dueño.
Masticador|20|0|10|Mutante|Tierra|m|Al invocarlo: destruye un monstruo del campo.

Muro|0|0|20|Mutante|Tierra|m|No puede atacar.
Reciclador|40|10|30|Mutante|Tierra|m|Al invocarlo: remueve una carta de tu cementerio y ganas su coste.
Mono jefe de guerra|20|0|10|Mono|Fuego|m|Todos los monos en el campo tienen +10/+10.
Mono tamborilero|40|10|40|Mono|Tierra|m|Al atacar: +10 ATQ por cada otro mono que ataque ese turno.
Monstruo fugaz|0|10|10|Mutante|Fuego|m|Se sacrifica al final del turno.
Monstruo veloz|20|10|10|Mutante|Viento|m|Ataca dos veces por turno.
Mutante cero|0|10|10|Mutante|Fuego|m|Debe atacar cada turno.
Debilitador|20|0|10|Mutante|Aether|m|Al invocarlo: un monstruo pierde 10 DEF hasta el final del turno.
Puerco lodoso|40|0|40|Puerco|Tierra|m|En defensa: tus puercos ganan +10 DEF.
Alma del bosque|20|0|10|Espíritu|Aether|m|Tu oponente paga 10 más por su siguiente monstruo.

Cura|0||||s|Ganas 10 de energía.
Mata gigante|0||||s|Destruye un monstruo de coste 100.
Absorbe vida|0||||s|Sacrifica un monstruo y ganas energía igual a su ATQ.

Ruleta antigua|0||||s|Roba dos cartas y pon una de tu mano al fondo del mazo.
Debilitar|0||||s|Un monstruo pierde 10 ATQ y DEF hasta el final del turno.
Cura 2|10||||s|20 de energía temporal solo para invocar monstruos este turno.
Flama|0||||s|El oponente pierde 10 de energía.
Ciclo|0||||s|Pon una carta de tu mano al fondo del mazo y roba una.
A dormir|10||||s|Un monstruo rival pasa a defensa hasta el final del turno.
Selección de archivo|0||||s|Mira 3 cartas del tope, toma una y devuelve las demás.
Ciclo temporal|100||||s|Cada jugador descarta su mano y roba la misma cantidad.
Niega magia|20||||r|Niega una magia del oponente.
Niega trampa|20||||r|Niega una respuesta del oponente.
Barrera|20||||r|Destruye un monstruo que ataca.
Debilidad|0||||r|Al atacar: un monstruo pierde 10 ATQ y 10 DEF.
Refuerzo|0||||r|Al atacar: +10 DEF a un monstruo tuyo.
Impuesto a la carne|10||||r|Niega una magia rival salvo que sacrifique un monstruo.
Proteccion|0||||r|Este turno no recibes daño.
Proteccion espiritual|10||||r|Este turno tus monstruos atacados no se destruyen en batalla.
Renacer|50||||r|Regresa un monstruo de tu cementerio al campo sin pagar.
Destruye coste bajo|100||||r|Destruye un monstruo de coste 0.
Trampa escondida|20||||r|Destruye un monstruo recién invocado.
Olvido|100||||r|Remueve del juego una carta del campo.
Revitalizar|20||||r|Niega un ataque y ganas energía igual a su ATQ.
Stun|10||||r|Niega un ataque; ese monstruo no ataca el siguiente turno.
Sobrepoblacion|50||||r|Si el rival invoca, destruye todos los monstruos.
`).forEach(c=>CAT[c.n]=c);for(let i=2;i<10;i++)CAT['Mono '+i]={n:'Mono '+i,c:i*10,a:i*10,d:i*10,ty:'Mono',st:'Tierra',k:'m',x:''};
const EV={'Niega magia':'m','Impuesto a la carne':'m','Niega trampa':'r','Barrera':'a','Revitalizar':'a','Stun':'a','Debilidad':'a','Refuerzo':'a','Proteccion':'a','Proteccion espiritual':'a','Trampa escondida':'s','Sobrepoblacion':'s','Renacer':'x','Destruye coste bajo':'x','Olvido':'x'};
const DK={Mono:'Mono 0,Monino,Mono 2,Mono 3,Mono 4,Mono 5,Mono 6,Mono 7,Mono 8,Mono 9,Mono loco,Adelanta,Explosión,Regresa,Fuerza,Cura,Mata gigante,Absorbe vida,Mirada remota,Hechizo mono prohibido,Ruleta antigua,Rebotador,Masticador,Doble monstruo,Desterrador,Curandero,Ayudante,Muro,Reciclador,Mono jefe de guerra,Mono tamborilero,Niega magia,Niega trampa,Barrera,Debilidad,Refuerzo,Impuesto a la carne,Proteccion,Proteccion espiritual,Renacer',
Puerco:'Puerco 0,Puerco 1,Puerco 2,Puerco 3,Puerco cuarto,Puerconio,Puerco con estilo,Puerco 7,Puerco 8,La cerda,Puercomelon,Adelanta,Explosión,Regresa,Debilitar,Cura 2,Flama,Ciclo,A dormir,Selección de archivo,Ciclo temporal,Masticador,Monstruo fugaz,Monstruo veloz,Mutante cero,Rebotador,Debilitador,Puerco lodoso,Alma del bosque,Puerco alpha,Mago mimo,Destruye coste bajo,Trampa escondida,Niega magia,Niega trampa,Barrera,Olvido,Revitalizar,Stun,Sobrepoblacion'};
// ===== MOTOR =====
let G;const doc=typeof document!=='undefined',$=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n),sh=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(t,o)=>({...t,t,o,pos:'a',ba:0,bd:0,ta:0,td:0,an:0,pc:0}),back=c=>mk(c.t,c.o);
const wait=ms=>new Promise(r=>setTimeout(r,G&&G.fast?0:ms));
const win=i=>G.two?'Gana '+G.p[i].nm:i?'Gana la CPU':'Gana el jugador';
function seat(i){if(!G.two||G.v===i||!doc)return;return new Promise(r=>{const h=$('ho');h.innerHTML='<b>Pasa el celular a '+G.p[i].nm+'</b><button>Estoy listo</button>';h.style.display='flex';h.querySelector('button').onclick=()=>{h.style.display='none';G.v=i;draw();r()}})}
const log=s=>{G.log.push('T'+G.turn+' · '+s);draw()};
const allM=()=>[...G.p[0].f,...G.p[1].f];
const A=c=>{let v=c.a+c.ba+c.ta;if(c.ty==='Mono')v+=10*allM().filter(x=>x.n==='Mono jefe de guerra').length;if(c.ty==='Puerco')v+=10*G.p[c.o].f.filter(x=>x.n==='Puerco alpha').length;return Math.max(0,v)};
const Df=c=>{let v=c.d+c.bd+c.td;if(c.ty==='Mono')v+=10*allM().filter(x=>x.n==='Mono jefe de guerra').length;if(c.ty==='Puerco')v+=10*G.p[c.o].f.filter(x=>x.n==='Puerco lodoso'&&x.pos==='d').length;return v};
const rm=c=>{const p=G.p[c.o];p.f=p.f.filter(x=>x!==c)};
const kill=c=>{if(c.n==='Doble monstruo'&&!c.u){c.u=1;log('Doble monstruo resiste');return}rm(c);(c.rm?G.p[c.o].x:G.p[c.o].g).push(back(c))};
const sac=c=>{rm(c);G.p[c.o].e+=c.c;(c.rm?G.p[c.o].x:G.p[c.o].g).push(back(c))};
const bounce=c=>{rm(c);G.p[c.o].hand.push(back(c))};
const all=()=>{for(const c of allM())kill(c)};
function chk(){for(const c of allM())if(Df(c)<=0)kill(c);const a=G.p[0].e<=0,b=G.p[1].e<=0;if(a||b)G.over=a&&b?'Empate':a?win(1):win(0)}
const dmg=(i,n)=>{if(G.p[i].prot)return;G.p[i].e-=n;chk()};
function draw1(i){const p=G.p[i];if(!p.deck.length){G.over=win(1-i);return}p.hand.push(p.deck.pop())}
const cost=(i,c)=>c.c+(c.k==='m'?G.p[i].tax:0);
function can(i,c){const p=G.p[i],n=cost(i,c),r=n-(c.k==='m'?Math.min(p.tmp,n):0);return(c.k!=='m'||p.f.length<5)&&(r<=0||p.e-r>0)}
function pay(i,c){const p=G.p[i],n=cost(i,c);if(c.k==='m'){p.tax=0;const t=Math.min(p.tmp,n);p.tmp-=t;p.e-=n-t}else p.e-=n}
async function modal(t,L,i){if(i!==undefined)await seat(i);return new Promise(r=>{if(!doc)return r(0);$('ov').innerHTML='<div><b>'+t+'</b>'+L.map((x,i)=>'<button data-m='+i+'>'+x+'</button>').join('')+'</div>';$('ov').style.display='flex';$('ov').onclick=e=>{const b=e.target.closest('[data-m]');if(b){$('ov').style.display='none';r(+b.dataset.m)}}})}
function panel(h){$('ov').innerHTML='<div style="width:90vw">'+h+'<button data-x>Cerrar</button></div>';$('ov').style.display='flex';$('ov').onclick=e=>{if(e.target.closest('[data-x]')||e.target===$('ov'))$('ov').style.display='none'}}
const yn=async(i,q)=>G.p[i].h?(await modal(q,['Sí','No'],i))===0:G.p[i].lv>1&&Math.random()<.5;
async function pick(i,fn,want){const L=allM().filter(fn);if(!L.length)return null;
 if(!G.p[i].h){const b=a=>[...a].sort((x,y)=>A(y)-A(x))[0],mi=L.filter(c=>c.o===i),th=L.filter(c=>c.o!==i);return want==='p'?b(mi.length?mi:L):b(th.length?th:L)}
 await seat(i);return new Promise(r=>{G.pk={L,r};draw()})}
async function bottom(i){const p=G.p[i];if(!p.hand.length)return;let k;if(p.h)k=await modal('Carta al fondo del mazo',p.hand.map(c=>c.n),i);else k=p.hand.indexOf([...p.hand].sort((a,b)=>b.c-a.c)[0]);p.deck.unshift(p.hand.splice(k,1)[0])}
const E={'Adelanta':x=>draw1(x.p),'Explosión':()=>all(),'Cura':x=>{G.p[x.p].e+=10},'Cura 2':x=>{G.p[x.p].tmp+=20},'Flama':x=>dmg(1-x.p,10),
'Regresa':async x=>{const c=await pick(x.p,()=>1,'o');if(c)bounce(c)},
'Fuerza':async x=>{const c=await pick(x.p,()=>1,'p');if(c){c.ba+=10;c.bd+=10}},
'Mata gigante':async x=>{const c=await pick(x.p,m=>m.c===100,'o');if(c)kill(c)},
'Absorbe vida':async x=>{const c=await pick(x.p,m=>m.o===x.p,'p');if(c){const a=A(c);sac(c);G.p[x.p].e+=a}},
'Mirada remota':async x=>{const h=G.p[1-x.p].hand;if(h.length&&G.p[x.p].h){const c=h[rnd(h.length)];await modal('Carta del rival: '+c.n+' ('+c.c+'). '+c.x,['OK'],x.p)}},
'Hechizo mono prohibido':async x=>{const p=G.p[x.p],L=p.g.filter(c=>c.ty==='Mono'&&c.k==='m');if(!p.hand.some(c=>c.ty==='Mono'&&c.k==='m')||!L.length)return;const c=L.sort((a,b)=>b.a-a.a)[0];p.g=p.g.filter(y=>y!==c);c.rm=1;await summon(x.p,c)},
'Ruleta antigua':async x=>{draw1(x.p);draw1(x.p);await bottom(x.p)},'Ciclo':async x=>{await bottom(x.p);draw1(x.p)},
'Debilitar':async x=>{const c=await pick(x.p,()=>1,'o');if(c){c.ta-=10;c.td-=10}},
'A dormir':async x=>{const c=await pick(x.p,m=>m.o!==x.p&&m.pos==='a','o');if(c){c.pos='d';c.rv=1}},
'Selección de archivo':async x=>{const p=G.p[x.p],t=p.deck.splice(-3);if(!t.length)return;const k=p.h?await modal('Toma una carta',t.map(c=>c.n),x.p):t.indexOf([...t].sort((a,b)=>b.c-a.c)[0]);p.hand.push(t[k]);p.deck.push(...t.filter((_,j)=>j!==k))},
'Ciclo temporal':()=>{for(const i of[0,1]){const p=G.p[i],n=p.hand.length;p.g.push(...p.hand);p.hand=[];for(let k=0;k<n;k++)draw1(i)}}};
const R={'Niega magia':(x,b)=>{if(b&&b.t==='m')b.cancel=1},'Niega trampa':(x,b)=>{if(b&&b.t==='r')b.cancel=1},
'Impuesto a la carne':async(x,b)=>{if(!b||b.t!=='m')return;const q=b.p;if(G.p[q].f.length&&await yn(q,'¿Sacrificar un monstruo para evitar la negación?')){const c=await pick(q,m=>m.o===q,'p');if(c){sac(c);return}}b.cancel=1},
'Barrera':(x,b)=>{if(b&&b.t==='a'){b.cancel=1;kill(b.c)}},'Revitalizar':(x,b)=>{if(b&&b.t==='a'){b.cancel=1;G.p[x.p].e+=A(b.c)}},
'Stun':(x,b)=>{if(b&&b.t==='a'){b.cancel=1;b.c.stun=G.turn+2}},'Trampa escondida':(x,b)=>{if(b&&b.t==='s')kill(b.c)},'Sobrepoblacion':(x,b)=>{if(b&&b.t==='s')all()},
'Debilidad':async x=>{const c=await pick(x.p,()=>1,'o');if(c){c.ba-=10;c.bd-=10}},'Refuerzo':async x=>{const c=await pick(x.p,m=>m.o===x.p,'p');if(c)c.bd+=10},
'Proteccion':x=>{G.p[x.p].prot=1},'Proteccion espiritual':x=>{G.p[x.p].sp=1},
'Renacer':async x=>{const p=G.p[x.p],L=p.g.filter(c=>c.k==='m');if(!L.length)return;let c;if(p.h){const k=await modal('Regresa un monstruo',L.map(y=>y.n),x.p);c=L[k]}else c=L.sort((a,b)=>b.c-a.c)[0];p.g=p.g.filter(y=>y!==c);await summon(x.p,c)},
'Destruye coste bajo':async x=>{const c=await pick(x.p,m=>m.c===0,'o');if(c)kill(c)},
'Olvido':async x=>{const c=await pick(x.p,()=>1,'o');if(c){rm(c);G.p[c.o].x.push(back(c))}}};
const EB={'Rebotador':async(c,i)=>{const t=await pick(i,m=>m!==c,'o');if(t)bounce(t)},'Masticador':async(c,i)=>{const t=await pick(i,m=>m!==c,'o');if(t)kill(t)},
'Desterrador':async(c,i)=>{const t=await pick(i,m=>m!==c,'o');if(t){rm(t);G.p[t.o].x.push(back(t))}},

$('go').onclick=()=>newGame($('s0').value,$('s1').value,+$('sl').value,true,$('sm').value==2);$('bed').onclick=()=>editor()}
if(doc){document.addEventListener('click',e=>{const t=e.target.closest('[data-z],[data-a]');if(!t||!G||!G.p)return;if(t.dataset.a){act(ACT[t.dataset.a]);return}
 const z=t.dataset.z,i=+t.dataset.i,c=z==='h'?G.p[G.v].hand[i]:z==='p'?G.p[G.v].f[i]:G.p[1-G.v].f[i];if(!c)return;if(G.pk&&G.pk.L.includes(c)){const r=G.pk.r;G.pk=null;r(c);return}G.sel=c;draw()});setup()}
if(typeof module!=='undefined')module.exports={newGame,get G(){return G}};
</script></body></html>
